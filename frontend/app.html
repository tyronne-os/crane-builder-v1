<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crane Builder</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@1&display=swap">
<style>
/* ── single dark-first design — IDE surface ── */
:root {
  --bg:         #09090b;
  --surface:    #111113;
  --surface2:   #18181b;
  --border:     rgba(255,255,255,.08);
  --border-mid: rgba(255,255,255,.12);
  --fg:         #fafafa;
  --fg-2:       #e4e4e7;
  --fg-3:       #d4d4d8;
  --fg-4:       #a1a1aa;
  --fg-5:       #71717a;
  --gold:       #eeca50;
  --gold-dim:   #c6a23a;
  --gold-dark:  #6c4a08;
  --gold-grad:  linear-gradient(138deg,#6c4a08 0%,#c6a23a 24%,#eeca50 50%,#c6a23a 76%,#6c4a08 100%);
  --gold-chrome:linear-gradient(115deg,#5a3d05 0%,#c6a23a 18%,#fff6cf 30%,#eeca50 42%,#8a6410 56%,#f5d775 70%,#b88a22 88%,#5a3d05 100%);
  --green:      #34d399;
  --red:        #dc2626;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--fg); font-family: 'Geist', system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
a { color: var(--gold); text-decoration: none; }
button { cursor: pointer; font-family: 'Geist', sans-serif; }
textarea { font-family: 'Geist', sans-serif; }
textarea::placeholder { color: var(--fg-5); }

@keyframes wave    { 0%,100%{transform:scaleY(.25)} 50%{transform:scaleY(1)} }
@keyframes chrome  { 0%,100%{background-position:0% 0} 50%{background-position:100% 0} }
@keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:.4} }
@keyframes rise    { 0%{opacity:0;transform:translateY(16px)} 100%{opacity:1;transform:translateY(0)} }
@keyframes glint   { 0%,30%{background-position:160% 0} 70%,100%{background-position:-60% 0} }
@keyframes slide-in { from{transform:translateY(8px);opacity:0} to{transform:translateY(0);opacity:1} }

/* ── layout shell ── */
.app { height: 100%; display: grid; grid-template-rows: 56px minmax(0,1fr); }

/* ── header ── */
.header {
  display: flex; align-items: center; gap: 12px;
  padding: 0 16px; min-width: 0; overflow: hidden;
  border-bottom: 1px solid var(--border); background: var(--bg);
}
.logo { display: flex; align-items: flex-end; gap: 4px; text-decoration: none; flex-shrink: 0; }
.logo-c {
  font-family: Georgia, serif; font-size: 38px; line-height: .78; font-weight: 700;
  background: var(--gold-chrome); background-size: 220% 100%;
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  animation: chrome 5s ease-in-out infinite;
}
.logo-rane  { font-size: 13px; font-weight: 700; letter-spacing: .22em; color: var(--fg); padding-bottom: 2px; }
.logo-tag   { font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: .3em; color: var(--gold); padding-bottom: 3px; margin-left: 4px; }
.divider-v  { width: 1px; height: 22px; background: var(--border-mid); flex-shrink: 0; }
.btn-project {
  display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px;
  border-radius: 10px; background: var(--surface); border: 1px solid var(--border-mid);
  color: var(--fg-2); font-size: 13px; font-weight: 500; white-space: nowrap;
}
.btn-project:hover { background: var(--surface2); }
/* project switcher */
.proj-overlay { position:fixed; inset:0; z-index:200; background:rgba(0,0,0,.45); display:flex; align-items:flex-start; justify-content:flex-start; padding:56px 0 0 12px; }
.proj-panel { width:320px; max-height:calc(100vh - 76px); background:var(--bg); border:1px solid var(--border-mid); border-radius:14px; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 12px 40px rgba(0,0,0,.5); }
.proj-head { display:flex; align-items:center; justify-content:space-between; padding:14px 16px 10px; border-bottom:1px solid var(--border); }
.proj-head h3 { font:600 14px 'Geist',sans-serif; color:var(--fg-1); margin:0; }
.proj-list { overflow-y:auto; flex:1; padding:8px; display:flex; flex-direction:column; gap:4px; }
.proj-item { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:9px; border:1px solid transparent; cursor:pointer; background:none; text-align:left; width:100%; }
.proj-item:hover { background:var(--surface); }
.proj-item.active { background:rgba(238,202,80,.07); border-color:rgba(238,202,80,.25); }
.proj-item-dot { width:8px; height:8px; border-radius:50%; background:var(--fg-5); flex-shrink:0; }
.proj-item.active .proj-item-dot { background:var(--gold); box-shadow:0 0 6px var(--gold); }
.proj-item-body { flex:1; min-width:0; }
.proj-item-name { font:500 13px 'Geist',sans-serif; color:var(--fg-1); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.proj-item-meta { font:400 10.5px 'Geist Mono',monospace; color:var(--fg-5); margin-top:2px; }
.proj-item-del { opacity:0; padding:3px 6px; border-radius:6px; background:none; border:none; color:#fca5a5; font-size:14px; cursor:pointer; flex-shrink:0; }
.proj-item:hover .proj-item-del { opacity:1; }
.proj-footer { padding:10px; border-top:1px solid var(--border); }
.proj-new-input { width:100%; height:34px; padding:0 10px; border-radius:8px; background:var(--surface); border:1px solid var(--border-mid); color:var(--fg-1); font:400 13px 'Geist',sans-serif; box-sizing:border-box; margin-bottom:8px; }
.proj-new-input::placeholder { color:var(--fg-5); }
.btn-new {
  display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px;
  border-radius: 10px; background: transparent; border: 1px solid var(--border-mid);
  color: var(--fg-3); font-size: 13px; font-weight: 500;
}
.btn-new:hover { background: var(--surface); }
.header-spacer { flex: 1; }
.tab-group { display: flex; padding: 3px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); flex-shrink: 0; }
.tab { height: 28px; padding: 0 14px; border-radius: 7px; border: none; font-size: 12px; font-weight: 600; letter-spacing: .06em; transition: background .15s, color .15s; }
.tab.active  { background: var(--gold-grad); color: #1a1204; }
.tab.inactive{ background: transparent; color: var(--fg-4); }
.tab.inactive:hover { color: var(--fg-2); }
.status-pill {
  display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px;
  border-radius: 999px; border: 1px solid var(--border-mid);
  font-family: 'Geist Mono', monospace; font-size: 11px; color: var(--fg-3); white-space: nowrap; flex-shrink: 0;
}
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: pulse-dot 2s ease-in-out infinite; }
.btn-ship {
  height: 32px; padding: 0 14px; border-radius: 10px;
  border: 1px solid rgba(255,236,170,.5); background: var(--gold-grad);
  color: #1a1204; font-size: 12px; font-weight: 700; letter-spacing: .1em;
  transition: transform .12s; flex-shrink: 0;
}
.btn-ship:hover  { transform: scale(1.03); }
.btn-ship:active { transform: scale(.96); }

/* ── body grid ── */
.body-grid {
  display: grid;
  grid-template-columns: clamp(260px,24vw,400px) minmax(0,1fr) clamp(220px,22vw,380px);
  min-height: 0;
}

/* ── left sidebar — chat ── */
.chat-sidebar { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--border); }
.messages { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 18px; }
.messages::-webkit-scrollbar { width: 4px; }
.messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 4px; }
.msg { display: flex; flex-direction: column; gap: 6px; }
.msg.me  { align-items: flex-end; }
.msg.bot { align-items: flex-start; }
.msg-meta { display: flex; align-items: center; gap: 6px; font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: .12em; color: var(--fg-5); }
.msg-bubble { max-width: 92%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.55; color: var(--fg-2); text-wrap: pretty; }
.msg.me  .msg-bubble { background: #1c1c1f; border: 1px solid var(--border-mid); }
.msg.bot .msg-bubble { background: transparent; border: 1px solid transparent; }
.msg-steps { width: 92%; display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: 12px; background: #0e0e10; border: 1px solid var(--border); font-family: 'Geist Mono', monospace; font-size: 12px; }
.step { display: flex; align-items: center; gap: 8px; }

/* ── composer ── */
.composer-wrap { padding: 12px; }
.composer { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 18px; background: var(--surface); border: 1px solid var(--border-mid); box-shadow: 0 10px 30px rgba(0,0,0,.4); transition: border-color .2s; }
.composer.drag-over { border-color: rgba(238,202,80,.7); background: linear-gradient(var(--surface), rgba(238,202,80,.04)); }
.att-row { display: flex; gap: 8px; flex-wrap: wrap; }
.att-thumb { position: relative; width: 58px; height: 58px; border-radius: 10px; border: 1px solid var(--border-mid); overflow: hidden; background: var(--surface2); }
.att-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.att-x { position: absolute; top: 2px; right: 2px; width: 16px; height: 16px; border-radius: 50%; border: none; background: rgba(0,0,0,.65); color: #fca5a5; font: 700 11px/16px 'Geist',sans-serif; text-align: center; cursor: pointer; padding: 0; }
.msg-imgs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.msg-imgs img { width: 120px; height: 120px; object-fit: cover; border-radius: 10px; border: 1px solid var(--border); }
.composer textarea { width: 100%; resize: none; background: transparent; border: none; outline: none; color: var(--fg); font-size: 14px; line-height: 1.5; }
.composer-row { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; }
.tool-btn { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 9px; border: none; background: transparent; color: var(--fg-4); }
.tool-btn:hover { background: #1c1c1f; color: var(--fg); }
.model-chip { display: flex; align-items: center; gap: 4px; height: 28px; padding: 0 8px; margin-left: 4px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--fg-3); font-family: 'Geist Mono', monospace; font-size: 11px; }
.model-chip:hover { background: var(--surface2); }
.composer-spacer { flex: 1; }
.btn-mic  { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--border-mid); background: var(--surface2); color: var(--fg-2); transition: all .15s; }
.btn-mic:active { transform: scale(.94); }
.btn-send { width: 34px; height: 34px; margin-left: 6px; display: grid; place-items: center; border-radius: 50%; border: 1px solid rgba(255,236,170,.5); background: var(--gold-grad); color: #1a1204; }
.btn-send:hover  { filter: brightness(1.08); }
.btn-send:active { transform: scale(.94); }

/* ── main panel ── */
.main-panel { display: flex; flex-direction: column; min-height: 0; background: #0c0c0e; padding: 14px; gap: 10px; }
.url-bar { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); font-family: 'Geist Mono', monospace; font-size: 12px; color: var(--fg-4); flex-shrink: 0; }
.url-text { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.live-badge { color: var(--green); }
.preview-frame { flex: 1; min-height: 0; border-radius: 14px; overflow: hidden; border: 1px solid var(--border); }

/* ── idle empty state ── */
.idle-state {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  background: #0a0a0c;
  color: var(--fg-5);
  text-align: center;
  padding: 24px;
}
.idle-icon {
  width: 52px; height: 52px;
  border-radius: 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  display: grid; place-items: center;
  color: var(--fg-5);
  margin-bottom: 4px;
}
.idle-title { font-size: 14px; font-weight: 600; color: var(--fg-4); letter-spacing: -.01em; }
.idle-sub   { font-size: 12px; line-height: 1.6; color: var(--fg-5); max-width: 260px; }
.idle-pulse {
  width: 6px; height: 6px; border-radius: 50%;
  background: rgba(255,255,255,.15);
  box-shadow: 16px 0 0 rgba(255,255,255,.1), -16px 0 0 rgba(255,255,255,.1);
}

/* ── Crane IT landing page preview ── */
.crane-preview { height: 100%; overflow-y: auto; background: #09090b; font-family: 'Geist', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
.crane-preview::-webkit-scrollbar { width: 6px; }
.crane-preview::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 4px; }

.crane-hero {
  position: relative;
  width: 100%;
  min-height: 520px;
  overflow: hidden;
  background: #09090b;
  display: flex;
  flex-direction: column;
}
.crane-hero-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 50% 30%;
}
.crane-hero-overlay-top    { position: absolute; inset: 0 0 auto; height: 200px; background: linear-gradient(180deg, rgba(9,9,11,.88) 0%, rgba(9,9,11,0) 100%); pointer-events: none; }
.crane-hero-overlay-bottom { position: absolute; inset: auto 0 0; height: 55%; background: linear-gradient(0deg, #09090b 0%, rgba(9,9,11,.88) 45%, rgba(9,9,11,0) 100%); pointer-events: none; }

.crane-nav {
  position: relative;
  z-index: 10;
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 16px;
  padding: 20px clamp(14px,3vw,36px);
  animation: rise .8s cubic-bezier(.2,.8,.2,1) .2s both;
}
.crane-logo { display: flex; align-items: flex-end; gap: 6px; justify-self: start; }
.crane-logo-c {
  font-family: Georgia, 'Times New Roman', serif;
  font-size: clamp(60px,8vw,110px);
  line-height: .74;
  font-weight: 700;
  letter-spacing: -.04em;
  background: var(--gold-chrome);
  background-size: 220% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 4px 14px rgba(0,0,0,.55)) drop-shadow(0 0 18px rgba(245,196,81,.25));
  animation: chrome 5s ease-in-out infinite;
}
.crane-logo-text { display: flex; flex-direction: column; gap: 6px; padding-bottom: 4px; }
.crane-logo-name { font-size: clamp(16px,2vw,26px); font-weight: 700; letter-spacing: .24em; color: #fafafa; line-height: 1; text-shadow: 0 2px 12px rgba(0,0,0,.6); }
.crane-logo-sub  { font-family: 'Geist Mono', monospace; font-size: clamp(10px,1vw,13px); font-weight: 600; letter-spacing: .4em; color: var(--gold); line-height: 1; }
.crane-nav-links {
  justify-self: center;
  display: flex; align-items: center; gap: 2px;
  padding: 5px;
  border-radius: 999px;
  background: rgba(24,24,27,.55);
  border: 1px solid rgba(255,255,255,.1);
  backdrop-filter: blur(20px) saturate(1.4);
  -webkit-backdrop-filter: blur(20px) saturate(1.4);
  box-shadow: 0 8px 30px rgba(0,0,0,.35);
}
.crane-nav-links a { padding: 7px 14px; border-radius: 999px; font-size: 12px; font-weight: 500; color: #d4d4d8; transition: background .15s, color .15s; }
.crane-nav-links a.active { background: rgba(255,255,255,.1); color: #fafafa; }
.crane-nav-links a:hover { color: #fafafa; }
.crane-status-pill { justify-self: end; display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 999px; background: rgba(24,24,27,.55); border: 1px solid rgba(255,255,255,.1); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: .06em; color: #d4d4d8; }
.crane-status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: pulse-dot 2s ease-in-out infinite; }

.crane-hero-body {
  position: relative;
  z-index: 10;
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  gap: 14px;
  padding: 0 clamp(14px,3vw,36px) clamp(20px,5vh,40px);
  text-align: center;
}
.crane-eyebrow { font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: .18em; color: #a1a1aa; animation: rise .8s cubic-bezier(.2,.8,.2,1) 1.2s both; }
.crane-headline-row { display: flex; flex-direction: column; gap: 4px; min-height: 80px; }
.crane-slide {
  font-size: clamp(20px,2.8vw,44px);
  font-weight: 600;
  letter-spacing: -.04em;
  color: #fafafa;
  line-height: 1;
  transition: opacity .7s, transform .7s;
}
.crane-slide em { font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-weight: 400; color: #f5c451; }
.crane-slide.hidden { opacity: 0; height: 0; overflow: hidden; }
.crane-dots { display: flex; gap: 6px; justify-content: center; }
.crane-dot { height: 3px; border-radius: 2px; transition: all .5s; }
.crane-cta-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.crane-cta {
  display: inline-flex; align-items: center; justify-content: center;
  padding: clamp(14px,2vh,22px) clamp(32px,4vw,60px);
  border-radius: 999px;
  background: var(--gold-grad);
  color: #1a1204;
  font-size: clamp(14px,1.6vw,22px);
  font-weight: 800;
  letter-spacing: .14em;
  text-transform: uppercase;
  border: 1px solid rgba(255,236,170,.6);
  box-shadow: 0 14px 40px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.5), inset 0 -2px 4px rgba(80,50,0,.35);
  transition: filter .15s, transform .12s;
}
.crane-cta:hover  { filter: brightness(1.12); transform: scale(1.04); }
.crane-cta:active { transform: scale(.97); }
.crane-cta-sub { font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: .16em; color: #71717a; }

/* ── stats strip ── */
.crane-stats {
  background: #09090b;
  border-top: 1px solid rgba(255,255,255,.06);
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 0;
  padding: 0;
}
.crane-stat {
  padding: 20px 16px;
  border-right: 1px solid rgba(255,255,255,.06);
  display: flex;
  flex-direction: column;
  gap: 4px;
  align-items: center;
  text-align: center;
}
.crane-stat:last-child { border-right: none; }
.crane-stat-num { font-family: 'Geist Mono', monospace; font-size: clamp(20px,2.4vw,32px); font-weight: 700; color: var(--gold); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.crane-stat-label { font-size: 11px; color: var(--fg-5); letter-spacing: .06em; }

/* ── services ── */
.crane-services { padding: clamp(28px,5vw,56px) clamp(14px,3vw,36px); background: #09090b; }
.crane-section-eyebrow { font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: .26em; color: var(--fg-5); margin-bottom: 12px; }
.crane-section-heading { font-size: clamp(22px,2.8vw,38px); font-weight: 700; letter-spacing: -.03em; color: var(--fg); margin-bottom: clamp(20px,4vw,40px); line-height: 1.05; }
.crane-section-heading em { font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-weight: 400; color: var(--gold); }
.crane-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%,220px),1fr)); gap: 12px; }
.crane-card {
  padding: 20px;
  border-radius: 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 10px;
  transition: border-color .2s, background .2s;
}
.crane-card:hover { border-color: rgba(238,202,80,.25); background: #131315; }
.crane-card-icon {
  width: 36px; height: 36px; border-radius: 10px;
  background: linear-gradient(138deg, rgba(108,74,8,.6), rgba(198,162,58,.4));
  border: 1px solid rgba(238,202,80,.25);
  display: grid; place-items: center;
  color: var(--gold);
}
.crane-card-title { font-size: 15px; font-weight: 600; color: var(--fg); }
.crane-card-desc  { font-size: 13px; line-height: 1.55; color: var(--fg-4); }

/* ── code pane ── */
.code-pane { height: 100%; overflow-y: auto; margin: 0; padding: 18px 20px; background: #0a0a0c; font-family: 'Geist Mono', monospace; font-size: 13px; line-height: 1.7; color: var(--fg-3); }
.code-pane::-webkit-scrollbar { width: 6px; }
.code-pane::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 4px; }
.token-keyword  { color: #c084fc; }
.token-fn       { color: #60a5fa; }
.token-str      { color: #86efac; }
.token-comment  { color: #52525b; font-style: italic; }
.token-jsx      { color: #f9a8d4; }
.token-prop     { color: var(--gold); }

/* ── right sidebar — voice agent ── */
.agent-sidebar { display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--border); padding: 14px; gap: 10px; }

/* photo card */
.agent-card { position: relative; flex: 1; min-height: 0; border-radius: 20px; overflow: hidden; background: var(--surface); border: 1px solid var(--border); }

.agent-card-overlay { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(9,9,11,.96) 0%, rgba(9,9,11,.3) 50%, rgba(9,9,11,0) 100%); }

/* live badge */
.live-badge-pill { position: absolute; top: 12px; left: 12px; display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: rgba(9,9,11,.6); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--border-mid); font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: .12em; color: var(--fg); z-index: 2; }

/* voice state overlaid on photo bottom */

}
.agent-name-row { display: flex; align-items: center; justify-content: space-between; }

.agent-role { font-family: 'Geist Mono', monospace; font-size: 9px; letter-spacing: .14em; color: rgba(255,255,255,.45); }

/* oscilloscope waveform canvas */
.voice-canvas-wrap {
  border-radius: 10px;

  display: flex;
  flex-direction: column;
  gap: 6px;
}
.voice-canvas-label { display: flex; align-items: center; justify-content: space-between; white-space: nowrap; min-height: 13px; overflow: hidden; }
.voice-state-text { font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: .12em; color: var(--gold); flex: 0 0 auto; }
.voice-model-text { font-family: 'Geist Mono', monospace; font-size: 9px; letter-spacing: .08em; color: rgba(255,255,255,.3); }
#voiceCanvas { width: 100%; height: 44px; display: block; border-radius: 4px; }

/* call controls */
.agent-controls { display: flex; justify-content: center; gap: 8px; }
.ctrl-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--border-mid); background: rgba(24,24,27,.8); color: var(--fg-2); transition: all .15s; backdrop-filter: blur(8px); }
.ctrl-btn:hover { background: #2a2a2e; border-color: rgba(255,255,255,.2); }
.ctrl-btn.active-mic { background: rgba(238,202,80,.15); border-color: rgba(238,202,80,.5); color: var(--gold); }
.ctrl-btn.end { border: none; background: rgba(220,38,38,.85); color: #fff; }
.ctrl-btn.end:hover { background: #ef4444; }

/* transcript strip */
.transcript-strip {
  border-radius: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 10px 12px;
  font-size: 12px;
  line-height: 1.55;
  color: var(--fg-4);
  height: 118px;
  overflow-y: auto;
  flex: 0 0 auto;
  min-height: 48px;
  text-wrap: pretty;
  font-style: italic;
  position: relative;
}
.transcript-label { font-family: 'Geist Mono', monospace; font-size: 9px; letter-spacing: .14em; color: var(--fg-5); display: block; margin-bottom: 3px; font-style: normal; }
.transcript-cursor { display: inline-block; width: 2px; height: 11px; background: var(--gold); border-radius: 1px; margin-left: 2px; vertical-align: middle; animation: pulse-dot .8s ease-in-out infinite; }

/* wave bars kept for possible use */
.wb1 {animation:wave .60s ease-in-out 0s     infinite} .wb2 {animation:wave .70s ease-in-out -.13s infinite}
.wb3 {animation:wave .65s ease-in-out -.26s infinite} .wb4 {animation:wave .80s ease-in-out -.39s infinite}
.wb5 {animation:wave .62s ease-in-out -.52s infinite} .wb6 {animation:wave .75s ease-in-out -.65s infinite}
.wb7 {animation:wave .68s ease-in-out -.78s infinite} .wb8 {animation:wave .70s ease-in-out -.91s infinite}
.wb9 {animation:wave .63s ease-in-out -1.04s infinite} .wb10{animation:wave .72s ease-in-out -1.17s infinite}
.wb11{animation:wave .66s ease-in-out -1.30s infinite} .wb12{animation:wave .69s ease-in-out -1.43s infinite}

/* ── diffusion center panel ── */
.mode-bar { display:flex; align-items:center; gap:4px; padding:0 14px; height:38px; border-bottom:1px solid var(--border); background:var(--surface); flex-shrink:0; }
.mode-btn { display:flex; align-items:center; gap:5px; padding:4px 10px; border-radius:6px; font:600 10px 'Geist',sans-serif; letter-spacing:.1em; color:var(--fg-5); cursor:pointer; border:1px solid transparent; transition:color .15s,background .15s,border-color .15s; }
.mode-btn:hover { color:var(--fg-3); background:var(--surface2); }
.mode-btn.active { color:var(--gold); background:rgba(238,202,80,.08); border-color:rgba(238,202,80,.2); }
.mode-btn svg { opacity:.7; }
.mode-btn.active svg { opacity:1; }
.diffusion-panel { flex:1; display:flex; flex-direction:column; overflow:hidden; background:var(--bg); }
.diff-canvas { flex:1; display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative; }
.diff-canvas img, .diff-canvas video { max-width:100%; max-height:100%; object-fit:contain; border-radius:6px; }
.diff-canvas-empty { display:flex; flex-direction:column; align-items:center; gap:10px; color:var(--fg-5); }
.diff-canvas-empty svg { opacity:.3; }
.diff-canvas-empty p { font-size:12px; text-align:center; max-width:220px; line-height:1.5; }
.diff-toolbar { display:flex; align-items:center; gap:8px; padding:10px 14px; border-top:1px solid var(--border); background:var(--surface); flex-shrink:0; }
.diff-toolbar textarea { flex:1; resize:none; background:var(--surface2); border:1px solid var(--border-mid); border-radius:8px; padding:8px 10px; color:var(--fg); font:400 12px 'Geist',sans-serif; line-height:1.5; outline:none; height:52px; }
.diff-toolbar textarea:focus { border-color:rgba(238,202,80,.3); }
.btn-gen { height:52px; padding:0 18px; border-radius:8px; background:var(--gold-grad); color:#1a1204; font:700 11px 'Geist',sans-serif; letter-spacing:.08em; cursor:pointer; border:none; white-space:nowrap; flex-shrink:0; }
.btn-gen:disabled { opacity:.4; cursor:not-allowed; }
.diff-token-row { display:flex; align-items:center; gap:6px; padding:0 14px 10px; }
.diff-token-input { flex:1; background:var(--surface2); border:1px solid var(--border); border-radius:6px; padding:5px 8px; color:var(--fg-4); font:400 11px 'Geist Mono',monospace; outline:none; }
.diff-token-input:focus { border-color:rgba(238,202,80,.3); color:var(--fg); }
.diff-token-label { font:500 9px 'Geist',sans-serif; letter-spacing:.1em; color:var(--fg-5); white-space:nowrap; }
.diff-spinner { width:18px; height:18px; border:2px solid rgba(238,202,80,.3); border-top-color:var(--gold); border-radius:50%; animation:spin .7s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.diff-upload-btn { display:flex; align-items:center; gap:5px; padding:5px 10px; border-radius:6px; border:1px solid var(--border-mid); background:transparent; color:var(--fg-4); font:500 11px 'Geist',sans-serif; cursor:pointer; flex-shrink:0; }
.diff-upload-btn:hover { border-color:rgba(238,202,80,.3); color:var(--fg-2); }
.diff-ref-thumb { width:28px; height:28px; border-radius:4px; object-fit:cover; border:1px solid var(--border-mid); }

/* ── admin panel ── */
.btn-admin { width:34px; height:34px; border-radius:10px; display:grid; place-items:center; background:var(--surface); border:1px solid var(--border); color:var(--fg-4); flex-shrink:0; transition:color .15s,border-color .15s; }
.btn-admin:hover { color:var(--gold); border-color:rgba(238,202,80,.35); }
.adm-backdrop { position:fixed; inset:0; z-index:100; background:rgba(0,0,0,.6); backdrop-filter:blur(6px); display:grid; place-items:center; padding:24px; }
.adm { width:min(1040px,100%); height:min(680px,100%); display:grid; grid-template-columns:230px minmax(0,1fr); background:var(--surface); border:1px solid var(--border-mid); border-radius:16px; overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,.6); }
.adm-nav { display:flex; flex-direction:column; gap:2px; padding:16px 10px; background:var(--bg); border-right:1px solid var(--border); overflow-y:auto; }
.adm-title { font:700 10px 'Geist Mono',monospace; letter-spacing:.2em; color:var(--gold); padding:0 10px 12px; }
.adm-nav-item { display:flex; flex-direction:column; align-items:flex-start; gap:1px; padding:9px 10px; border-radius:9px; background:none; border:1px solid transparent; color:var(--fg-3); font:500 13px 'Geist',sans-serif; text-align:left; }
.adm-nav-item small { font-size:10.5px; color:var(--fg-5); }
.adm-nav-item:hover { background:var(--surface); }
.adm-nav-item.active { background:rgba(238,202,80,.07); border-color:rgba(238,202,80,.2); color:var(--gold); }
.adm-node { display:flex; align-items:center; gap:7px; padding:8px 10px; font:500 10px 'Geist Mono',monospace; color:var(--fg-5); }
.adm-body { display:flex; flex-direction:column; overflow-y:auto; padding:22px 26px; }
.adm-head { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:20px; }
.adm-head h2 { font:600 20px 'Geist',sans-serif; color:var(--fg); }
.adm-head p { font-size:12px; color:var(--fg-5); margin-top:3px; }
.adm-close { width:30px; height:30px; border-radius:8px; background:var(--surface2); border:1px solid var(--border); color:var(--fg-4); }
.adm-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; }
.adm-field { display:flex; flex-direction:column; gap:6px; padding:12px 14px; background:var(--bg); border:1px solid var(--border); border-radius:11px; }
.adm-label { font:600 10px 'Geist',sans-serif; letter-spacing:.1em; text-transform:uppercase; color:var(--fg-4); }
.adm-hint { font-size:10.5px; color:var(--fg-5); line-height:1.4; word-break:break-word; }
.adm-input { width:100%; background:var(--surface2); border:1px solid var(--border-mid); border-radius:7px; padding:7px 9px; color:var(--fg); font:400 12px 'Geist Mono',monospace; outline:none; resize:vertical; }
.adm-input:focus { border-color:rgba(238,202,80,.4); }
.adm-field input[type=range] { accent-color:var(--gold); width:100%; }
.adm-color { width:56px; height:30px; border:none; background:none; cursor:pointer; }
.adm-toggle { width:38px; height:22px; border-radius:11px; background:var(--surface2); border:1px solid var(--border-mid); position:relative; transition:background .15s; }
.adm-toggle span { position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:var(--fg-5); transition:transform .15s,background .15s; }
.adm-toggle.on { background:rgba(238,202,80,.25); border-color:rgba(238,202,80,.5); }
.adm-toggle.on span { transform:translateX(16px); background:var(--gold); }
.adm-actions { grid-column:1/-1; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.adm-btn { height:32px; padding:0 14px; border-radius:8px; background:var(--surface2); border:1px solid var(--border-mid); color:var(--fg-2); font:600 11px 'Geist',sans-serif; letter-spacing:.04em; cursor:pointer; display:inline-flex; align-items:center; }
.adm-btn.gold { background:var(--gold-grad); color:#1a1204; border-color:rgba(255,236,170,.5); }
.adm-btn.danger { color:#fca5a5; border-color:rgba(220,38,38,.4); }
.mrow { display:flex; align-items:center; gap:8px; width:100%; text-align:left; padding:7px 10px; border-radius:7px; border:none; background:transparent; font:400 11px 'Geist Mono',monospace; cursor:pointer; }
.mrow:hover { background:var(--surface); }
.mrow .mname { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.mrow .mtag { font-size:9px; flex-shrink:0; }
.medit { width:20px; height:20px; display:grid; place-items:center; border-radius:5px; color:var(--fg-4); opacity:0; flex-shrink:0; transition:opacity .12s; }
.mrow:hover .medit, .medit.has { opacity:1; }
.medit.has { color:var(--gold); }
.medit:hover { background:var(--surface2); color:var(--gold); }
.prof-rows { grid-column:1/-1; display:flex; flex-direction:column; gap:2px; padding:8px; background:var(--bg); border:1px solid var(--border); border-radius:11px; }
.adm-list { grid-column:1/-1; font:400 11px 'Geist Mono',monospace; color:var(--fg-4); display:flex; flex-direction:column; gap:4px; }
@media (max-width: 720px) { .adm { grid-template-columns:1fr; grid-template-rows:auto minmax(0,1fr); } .adm-nav { flex-direction:row; overflow-x:auto; } .adm-nav-item small, .adm-title, .adm-node { display:none; } }

/* ── responsive ── */
@media (max-width: 1100px) {
  .body-grid { grid-template-columns: clamp(260px,32vw,360px) minmax(0,1fr); }
  .agent-sidebar { display: none; }
  .status-pill { display: none; }
}
@media (max-width: 720px) {
  .body-grid { grid-template-columns: 1fr; grid-template-rows: auto minmax(0,1fr); }
  .chat-sidebar { max-height: 44vh; }

}
#root { height: 100%; }

<script type="application/json" id="crane-default-skills">{"skills": {"brandkit": {"desc": "Premium brand-kit image generation skill for creating high-end brand-guidelines boards, logo systems, identity decks, and visual-world presentations. Trained for minimalist, cinematic, editorial, dark", "content": "# BRANDKIT IMAGE GENERATION SKILL\n\nYou are an elite brand identity art director, logo designer, visual-system strategist, and presentation designer.\n\nYour job is to generate premium brand-kit images that feel like they came from a serious identity studio.\n\nThe output must feel:\n- intentional\n- premium\n- minimal\n- coherent\n- strategic\n- visually expensive\n- brand-system driven\n- presentation-ready\n\nDo not generate generic logos.  \nDo not generate random mockups.  \nDo not generate messy AI moodboards.\n\nCreate a complete brand world in one image.\n\n---\n\n# REFERENCE STYLE DNA\n\nThe desired visual quality is inspired by premium brand-guidelines decks with:\n\n- dark charcoal outer canvas\n- clean grid-based presentation boards\n- strong gutters between panels\n- restrained visual density\n- very sparse typography\n- large negative space\n- cinematic brand atmosphere\n- simple but memorable logo marks\n- UI mockups used as brand applications\n- browser chrome / app headers / terminal frames\n- image-led panels with subtle overlays\n- halftone, grain, scanline, or print texture\n- geometric construction diagrams\n- small labels and page-number details\n- muted but powerful accent colors\n- logo repeated across multiple touchpoints\n- one strong brand idea per board\n\nThe references are not a fixed style.  \nThey define the quality bar, restraint, and presentation logic.\n\n---\n\n# CORE PRINCIPLE\n\nA premium brand kit is not decoration.\n\nIt is a visual argument for why the brand exists.\n\nEvery generated board must answer:\n\n1. What does this brand represent?\n2. What is the core metaphor?\n3. How does the logo express that?\n4. How does the system scale across UI, print, image, and detail?\n5. Why does the whole thing feel ownable?\n\n---\n\n# DEFAULT OUTPUT\n\nUnless the user specifies otherwise:\n\n- Generate one brand-kit overview image\n- Default layout: `3 × 3`\n- Default aspect ratio: `4:3` or `16:10`\n- Use a clean presentation grid\n- Use consistent gutters\n- Use minimal text\n- Make every panel feel connected\n\nAllowed layouts:\n- `3 × 3` full identity system\n- `2 × 3` cinematic brand deck overview\n- `2 × 2` compact concept board\n- `1 × 3` horizontal brand strip\n- `4 × 2` wide contact-sheet layout\n- custom layout when requested\n\nIf the user gives references, match their quality and rhythm, not their exact content.\n\n---\n\n# BRAND STRATEGY FIRST\n\nBefore generating, infer the brand strategy.\n\nThink through:\n\n- category\n- audience\n- product function\n- emotional promise\n- cultural position\n- trust level\n- visual world\n- symbolic metaphor\n- what the brand should avoid\n\nThe visual system must be based on meaning.\n\nExamples:\n\n| Category | Core Ideas | Possible Symbol Logic |\n|---|---|---|\n| Developer tool | building, speed, precision, control | cursor, frame, bolt, scaffold, grid |\n| AI assistant | delegation, intelligence, clarity | spark, orbit, signal, path, node |\n| Security | protection, vigilance, boundary | shield, eye, seal, protected core |\n| Gaming / betting | chance, reward, tension, speed | dice, gem, card, signal, trophy |\n| Voice AI | sound, rhythm, command, flow | waveform, mic, orb, speech path |\n| Compliance | trust, order, rules, protection | seal, dog, badge, document, shield |\n| Drone / robotics | flight, control, vision, mission | wing, owl, crosshair, path, zone |\n| Luxury / editorial | taste, material, ritual, restraint | monogram, seal, paper, emboss, mark |\n| Productivity | focus, momentum, clarity | path, check, block, calendar, light |\n\nDo not pick symbols randomly.\n\n---\n\n# LOGO GENERATION STANDARD\n\nThe logo must be professional.\n\nIt should be:\n- simple\n- memorable\n- symbolic\n- scalable\n- ownable\n- visually balanced\n- connected to the brand idea\n- usable as icon, wordmark, badge, UI mark, and pattern\n\nAvoid:\n- generic lightning bolts unless strongly justified\n- random animals\n- fake luxury crests\n- copied famous marks\n- overcomplicated symbols\n- clipart-style icons\n- meaningless sparkles\n- inconsistent logo variants\n\nThe logo should feel like it came from research and reduction.\n\n---\n\n# LOGO CONCEPT METHODS\n\nUse one or combine two maximum.\n\n## 1. Monogram + Meaning\n\nCombine the brand initial with a metaphor.\n\nExamples:\n- `K` + kite / frame / direction\n- `N` + path / folded system\n- `S` + sound wave / speech flow\n- `A` + ascent / architecture / momentum\n\nDo not make a boring letter icon.  \nUse negative space, cuts, folds, or geometry.\n\n---\n\n## 2. Product Action\n\nTurn the product's main action into a symbol.\n\nExamples:\n- build → frame, scaffold, block, cursor\n- protect → shield, boundary, watch mark\n- convert → switch, arrow, transformation shape\n- speak → waveform, mic, pulse\n- hunt threats → eye, raptor, radar, trace\n- automate → loop, handoff, path\n\nMake it abstract and premium, not literal.\n\n---\n\n## 3. Metaphor Fusion\n\nCombine two meaningful ideas into one reduced mark.\n\nExamples:\n- owl + drone vision\n- shield + mountain\n- moon + waveform\n- dog + compliance seal\n- dice + mobile game economy\n- cursor + lightning speed\n- kite + product frame\n\nThe fusion should be subtle and readable.\n\n---\n\n## 4. Negative Space\n\nUse empty space to create intelligence.\n\nExamples:\n- hidden arrow\n- protected center\n- cutout initial\n- internal path\n- folded corner\n- eye formed by crossing shapes\n\nNegative space should be crisp.\n\n---\n\n## 5. Construction Geometry\n\nCreate a mark from a clear system.\n\nUse:\n- circles\n- diagonal cuts\n- grids\n- frames\n- modular blocks\n- layered cards\n- orbital paths\n- crosshairs\n- measured linework\n\nOne panel can show construction logic.\n\n---\n\n# BOARD COMPOSITION DNA\n\nA strong brand-kit board should feel like a curated sequence.\n\nUse:\n- large calm cover panel\n- one digital mockup panel\n- one image-led atmosphere panel\n- one system/construction panel\n- one physical or icon application panel\n- one quiet tagline panel\n\nDo not make every panel equally loud.\n\nThe board should have rhythm:\n- quiet\n- functional\n- emotional\n- technical\n- atmospheric\n- detailed\n\n---\n\n# DEFAULT 3 × 3 PANEL SYSTEM\n\nUse this if no layout is specified:\n\n## 1. Logo Cover\nLarge logo and wordmark.  \nMinimal title.  \nStrong negative space.\n\n## 2. Logo Construction\nSymbol breakdown, grid, geometry, or negative-space logic.  \nShow why the mark exists.\n\n## 3. Digital Application\nBrowser chrome, app header, terminal, dashboard fragment, or app icon.\n\n## 4. Brand Essence\nOne short tagline.  \nLarge readable typography.  \nSparse composition.\n\n## 5. Color System\nSwatches, gradient strips, color discs, material chips, or palette cards.\n\n## 6. Typography\nLarge type specimen, alphabet row, or primary/secondary type pairing.\n\n## 7. Physical Application\nCard, folder, badge, poster, label, seal, packaging, or object mockup.\n\n## 8. Image Direction\nCinematic landscape, product crop, halftone poster, editorial scene, material texture.\n\n## 9. System Detail\nUI chips, input bar, command line, icon row, badge system, component strip, pattern detail.\n\n---\n\n# 2 × 3 REFERENCE-STYLE LAYOUT\n\nFor boards like the uploaded references, use:\n\n1. **Logo / Wordmark**\n   - centered or offset\n   - extremely minimal\n\n2. **Browser / Product Surface**\n   - browser bar, app frame, prompt input, or URL field\n\n3. **Command / Functional Panel**\n   - terminal, prompt bar, input state, install command, dashboard fragment\n\n4. **Atmosphere / Campaign Image**\n   - halftone landscape, cinematic image, product-world visual, or art-directed photo\n\n5. **Symbol / Construction / Badge**\n   - logo mark in target, seal, geometric frame, icon construction\n\n6. **Tagline / System Promise**\n   - one short line\n   - large type\n   - quiet background\n\nThis layout should feel like a premium mini-deck.\n\n---\n\n# VISUAL MODES\n\nChoose based on the brand.\n\n## Dark Developer / Builder\n\nUse for:\ndeveloper tools, coding agents, infra, automation, AI builders.\n\nVisual cues:\n- near-black panels\n- monospace accents\n- command lines\n- terminal windows\n- prompt bars\n- subtle grid\n- cyan, blue, coral, or lime accents\n- pixel or CRT texture if appropriate\n\nLogo logic:\n- cursor + fr", "from": "tyronne-os/taste-skill", "on": false}, "industrial-brutalist-ui": {"desc": "Raw mechanical interfaces fusing Swiss typographic print with military terminal aesthetics. Rigid grids, extreme type scale contrast, utilitarian color, analog degradation effects. For data-heavy dash", "content": "# SKILL: Industrial Brutalism & Tactical Telemetry UI\n\n## 1. Skill Meta\n**Name:** Industrial Brutalism & Tactical Telemetry Interface Engineering\n**Description:** Advanced proficiency in architecting web interfaces that synthesize mid-century Swiss Typographic design, industrial manufacturing manuals, and retro-futuristic aerospace/military terminal interfaces. This discipline requires absolute mastery over rigid modular grids, extreme typographic scale contrast, purely utilitarian color palettes, and the programmatic simulation of analog degradation (halftones, CRT scanlines, bitmap dithering). The objective is to construct digital environments that project raw functionality, mechanical precision, and high data density, deliberately discarding conventional consumer UI patterns.\n\n## 2. Visual Archetypes\nThe design system operates by merging two distinct but highly compatible visual paradigms. **Pick ONE per project and commit to it. Do not alternate or mix both modes within the same interface.**\n\n### 2.1 Swiss Industrial Print\nDerived from 1960s corporate identity systems and heavy machinery blueprints.\n*   **Characteristics:** High-contrast light modes (newsprint/off-white substrates). Reliance on monolithic, heavy sans-serif typography. Unforgiving structural grids outlined by visible dividing lines. Aggressive, asymmetric use of negative space punctuated by oversized, viewport-bleeding numerals or letterforms. Heavy use of primary red as an alert/accent color.\n\n### 2.2 Tactical Telemetry & CRT Terminal\nDerived from classified military databases, legacy mainframes, and aerospace Heads-Up Displays (HUDs).\n*   **Characteristics:** Dark mode exclusivity. High-density tabular data presentation. Absolute dominance of monospaced typography. Integration of technical framing devices (ASCII brackets, crosshairs). Application of simulated hardware limitations (phosphor glow, scanlines, low bit-depth rendering).\n\n## 3. Typographic Architecture\nTypography is the primary structural and decorative infrastructure. Imagery is secondary. The system demands extreme variance in scale, weight, and spacing.\n\n### 3.1 Macro-Typography (Structural Headers)\n*   **Classification:** Neo-Grotesque / Heavy Sans-Serif.\n*   **Optimal Web Fonts:** Neue Haas Grotesk (Black), Inter (Extra Bold/Black), Archivo Black, Roboto Flex (Heavy), Monument Extended.\n*   **Implementation Parameters:**\n    *   **Scale:** Deployed at massive scales using fluid typography (e.g., `clamp(4rem, 10vw, 15rem)`).\n    *   **Tracking (Letter-spacing):** Extremely tight, often negative (`-0.03em` to `-0.06em`), forcing glyphs to form solid architectural blocks.\n    *   **Leading (Line-height):** Highly compressed (`0.85` to `0.95`).\n    *   **Casing:** Exclusively uppercase for structural impact.\n\n### 3.2 Micro-Typography (Data & Telemetry)\n*   **Classification:** Monospace / Technical Sans.\n*   **Optimal Web Fonts:** JetBrains Mono, IBM Plex Mono, Space Mono, VT323, Courier Prime.\n*   **Implementation Parameters:**\n    *   **Scale:** Fixed and small (`10px` to `14px` / `0.7rem` to `0.875rem`).\n    *   **Tracking:** Generous (`0.05em` to `0.1em`) to simulate mechanical typewriter spacing or terminal matrices.\n    *   **Leading:** Standard to tight (`1.2` to `1.4`).\n    *   **Casing:** Exclusively uppercase. Used for all metadata, navigation, unit IDs, and coordinates.\n\n### 3.3 Textural Contrast (Artistic Disruption)\n*   **Classification:** High-Contrast Serif.\n*   **Optimal Web Fonts:** Playfair Display, EB Garamond, Times New Roman.\n*   **Implementation Parameters:** Used exceedingly sparingly. Must be subjected to heavy post-processing (halftone filters, 1-bit dithering) to degrade vector perfection and create textural juxtaposition against the clean sans-serifs.\n\n## 4. Color System\nThe color architecture is uncompromising. Gradients, soft drop shadows, and modern translucency are strictly prohibited. Colors simulate physical media or primitive emissive displays.\n\n**CRITICAL: Choose ONE substrate palette per project and use it consistently. Never mix light and dark substrates within the same interface.**\n\n### If Swiss Industrial Print (Light):\n*   **Background:** `#F4F4F0` or `#EAE8E3` (Matte, unbleached documentation paper).\n*   **Foreground:** `#050505` to `#111111` (Carbon Ink).\n*   **Accent:** `#E61919` or `#FF2A2A` (Aviation/Hazard Red). This is the ONLY accent color. Used for strike-throughs, thick structural dividing lines, or vital data highlights.\n\n### If Tactical Telemetry (Dark):\n*   **Background:** `#0A0A0A` or `#121212` (Deactivated CRT. Avoid pure `#000000`).\n*   **Foreground:** `#EAEAEA` (White phosphor). This is the primary text color.\n*   **Accent:** `#E61919` or `#FF2A2A` (Aviation/Hazard Red). Same red, same rules.\n*   **Terminal Green (`#4AF626`):** Optional. Use ONLY for a single specific UI element (e.g., one status indicator or one data readout) — never as a general text color. If it doesn't serve a clear purpose, omit it entirely.\n\n## 5. Layout and Spatial Engineering\nThe layout must appear mathematically engineered. It rejects conventional web padding in favor of visible compartmentalization.\n\n*   **The Blueprint Grid:** Strict adherence to CSS Grid architectures. Elements do not float; they are anchored precisely to grid tracks and intersections.\n*   **Visible Compartmentalization:** Extensive utilization of solid borders (`1px` or `2px solid`) to delineate distinct zones of information. Horizontal rules (`<hr>`) frequently span the entire container width to segregate operational units.\n*   **Bimodal Density:** Layouts oscillate between extreme data density (tightly packed monospace metadata clustered together) and vast expanses of calculated negative space framing macro-typography.\n*   **Geometry:** Absolute rejection of `border-radius`. All corners must be exactly 90 degrees to enforce mechanical rigidity.\n\n## 6. UI Components and Symbology\nStandard web UI conventions are replaced with utilitarian, industrial graphic elements.\n\n*   **Syntax Decoration:** Utilization of ASCII characters to frame data points.\n    *   *Framing:* `[ DELIVERY SYSTEMS ]`, `< RE-IND >`\n    *   *Directional:* `>>>`, `///`, `\\\\\\\\`\n*   **Industrial Markers:** Prominent integration of registration (`®`), copyright (`©`), and trademark (`™`) symbols functioning as structural geometric elements rather than legal text.\n*   **Technical Assets:** Integration of crosshairs (`+`) at grid intersections, repeating vertical lines (barcodes), thick horizontal warning stripes, and randomized string data (e.g., `REV 2.6`, `UNIT / D-01`) to simulate active mechanical processes.\n\n## 7. Textural and Post-Processing Effects\nTo prevent the design from appearing purely digital, simulated analog degradation is engineered into the frontend via CSS and SVG filters.\n\n*   **Halftone and 1-Bit Dithering:** Transforming continuous-tone images or large serif typography into dot-matrix patterns. Achieved via pre-processing or CSS `mix-blend-mode: multiply` overlays combined with SVG radial dot patterns.\n*   **CRT Scanlines:** For terminal interfaces, applying a `repeating-linear-gradient` to the background to simulate horizontal electron beam sweeps (e.g., `repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.1) 2px, rgba(0,0,0,0.1) 4px)`).\n*   **Mechanical Noise:** A global, low-opacity SVG static/noise filter applied to the DOM root to introduce a unified physical grain across both dark and light modes.\n\n## 8. Web Engineering Directives\n1.  **Grid Determinism:** Utilize `display: grid; gap: 1px;` with contrasting parent/child background colors to generate mathematically perfect, razor-thin dividing lines without complex border declarations.\n2.  **Semantic Rigidity:** Construct the DOM using precise semantic tags (`<data>`, `<samp>`, `<kbd>`, `<output>`, `<dl>`) to accurately reflect the technical nature of the telemetry.\n3.  **Typography Clamping:** Implement CSS `clamp()` functions exclusively for macro-", "from": "tyronne-os/taste-skill", "on": false}, "gpt-taste": {"desc": "Elite UX/UI & Advanced GSAP Motion Engineer. Enforces Python-driven true randomization for layout variance, strict AIDA page structure, wide editorial typography (bans 6-line wraps), gapless bento gri", "content": "# CORE DIRECTIVE: AWWWARDS-LEVEL DESIGN ENGINEERING\nYou are an elite, award-winning frontend design engineer. Standard LLMs possess severe statistical biases: they generate massive 6-line wrapped headings by using narrow containers, leave ugly empty gaps in bento grids, use cheap meta-labels (\"QUESTION 05\", \"SECTION 01\"), output invisible button text, and endlessly repeat the same Left/Right layouts. \n\nYour goal is to aggressively break these defaults. Your outputs must be highly creative, perfectly spaced, motion-rich (GSAP), mathematically flawless in grid execution, and heavily rely on varied, high-end assets.\n\nDO NOT USE EMOJIS IN YOUR CODE, COMMENTS, OR OUTPUT. Maintain strictly professional formatting.\n\n## 1. PYTHON-DRIVEN TRUE RANDOMIZATION (BREAKING THE LOOP)\nLLMs are inherently lazy and always pick the first layout option. To prevent this, you MUST simulate a Python script execution in your `<design_plan>` before writing any UI code. \nUse a deterministic seed (e.g., character count of the user prompt modulo math) to simulate `random.choice()` and strictly select:\n- 1 Hero Architecture (from Section 3)\n- 1 Typography Stack (Satoshi, Cabinet Grotesk, Outfit, or Geist. NEVER Inter)\n- 3 Unique Component Architectures (from Section 6)\n- 2 Advanced GSAP Paradigms (from Section 5)\nYou are forbidden from defaulting to the same UI twice. You must follow the exact output of your simulated Python randomization.\n\n## 2. AIDA STRUCTURE & SPACING\nEvery page MUST begin with a highly creative, premium Navigation Bar (e.g., floating glass pill, or minimal split nav).\nThe rest of the page MUST follow the AIDA framework:\n- **Attention (Hero):** Cinematic, clean, wide layout.\n- **Interest (Features/Bento):** High-density, mathematically perfect grid or interactive typographic components.\n- **Desire (GSAP Scroll/Media):** Pinned sections, horizontal scroll, or text-reveals.\n- **Action (Footer/Pricing):** Massive, high-contrast CTA and clean footer links.\n**SPACING RULE:** Add huge vertical padding between all major sections (e.g., `py-32 md:py-48`). Sections must feel like distinct, cinematic chapters. Do not cramp elements together.\n\n## 3. HERO ARCHITECTURE & THE 2-LINE IRON RULE\nThe Hero must breathe. It must NOT be a narrow, 6-line text wall.\n- **The Container Width Fix:** You MUST use ultra-wide containers for the H1 (e.g., `max-w-5xl`, `max-w-6xl`, `w-full`). Allow the words to flow horizontally.\n- **The Line Limit:** The H1 MUST NEVER exceed 2 to 3 lines. 4, 5, or 6 lines is a catastrophic failure. Make the font size smaller (`clamp(3rem, 5vw, 5.5rem)`) and the container wider to ensure this.\n- **Hero Layout Options (Randomly Assigned via Python):**\n  1. *Cinematic Center (Highly Preferred):* Text perfectly centered, massive width. Below the text, exactly two high-contrast CTAs. Below the CTAs or behind everything, a stunning, full-bleed background image with a dark radial wash.\n  2. *Artistic Asymmetry:* Text offset to the left, with an artistic floating image overlapping the text from the bottom right.\n  3. *Editorial Split:* Text left, image right, but with massive negative space.\n- **Button Contrast:** Buttons must be perfectly legible. Dark background = white text. Light background = dark text. Invisible text is a failure.\n- **BANNED IN HERO:** Do NOT use arbitrary floating stamp/badge icons on the text. Do NOT use pill-tags under the hero. Do NOT place raw data/stats in the hero.\n\n## 4. THE GAPLESS BENTO GRID\n- **Zero Empty Space in Grids:** LLMs notoriously leave blank, dead cells in CSS grids. You MUST use Tailwind's `grid-flow-dense` (`grid-auto-flow: dense`) on every Bento Grid. You must mathematically verify that your `col-span` and `row-span` values interlock perfectly. No grid shall have a missing corner or empty void.\n- **Card Restraint:** Do not use too many cards. 3 to 5 highly intentional, beautifully styled cards are better than 8 messy ones. Fill them with a mix of large imagery, dense typography, or CSS effects.\n\n## 5. ADVANCED GSAP MOTION & HOVER PHYSICS\nStatic interfaces are strictly forbidden. You must write real GSAP (`@gsap/react`, `ScrollTrigger`).\n- **Hover Physics:** Every clickable card and image must react. Use `group-hover:scale-105 transition-transform duration-700 ease-out` inside `overflow-hidden` containers.\n- **Scroll Pinning (GSAP Split):** Pin a section title on the left (`ScrollTrigger pin: true`) while a gallery of elements scrolls upwards on the right side.\n- **Image Scale & Fade Scroll:** Images must start small (`scale: 0.8`). As they scroll into view, they grow to `scale: 1.0`. As they scroll out of view, they smoothly darken and fade out (`opacity: 0.2`).\n- **Scrubbing Text Reveals:** Opacity of central paragraph words starts at 0.1 and scrubs to 1.0 sequentially as the user scrolls.\n- **Card Stacking:** Cards overlap and stack on top of each other dynamically from the bottom as the user scrolls down.\n\n## 6. COMPONENT ARSENAL & CREATIVITY\nSelect components from this arsenal based on your randomization:\n- **Inline Typography Images:** Embed small, pill-shaped images directly INSIDE massive headings. Example: `I shape <span className=\"inline-block w-24 h-10 rounded-full align-middle bg-cover bg-center mx-2\" style={{backgroundImage: 'url(...)'}}><\/span> digital spaces.`\n- **Horizontal Accordions:** Vertical slices that expand horizontally on hover to reveal content and imagery.\n- **Infinite Marquee (Trusted Partners):** Smooth, continuously scrolling rows of authentic `@phosphor-icons/react` or large typography.\n- **Feedback/Testimonial Carousel:** Clean, overlapping portrait images next to minimalist typography quotes, controlled by subtle arrows.\n\n## 7. CONTENT, ASSETS & STRICT BANS\n- **The Meta-Label Ban:** BANNED FOREVER are labels like \"SECTION 01\", \"SECTION 04\", \"QUESTION 05\", \"ABOUT US\". Remove them entirely. They look cheap and unprofessional.\n- **Image Context & Style:** Use `https://picsum.photos/seed/{keyword}/1920/1080` and match the keyword to the vibe. Apply sophisticated CSS filters (`grayscale`, `mix-blend-luminosity`, `opacity-90`, `contrast-125`) so they do not look like boring stock photos.\n- **Creative Backgrounds:** Inject subtle, professional ambient design. Use deep radial blurs, grainy mesh gradients, or shifting dark overlays. Avoid flat, boring colors.\n- **Horizontal Scroll Bug:** Wrap the entire page in `<main className=\"overflow-x-hidden w-full max-w-full\">` to absolutely prevent horizontal scrollbars caused by off-screen animations.\n\n## 8. MANDATORY PRE-FLIGHT <design_plan>\nBefore writing ANY React/UI code, you MUST output a `<design_plan>` block containing:\n1. **Python RNG Execution:** Write a 3-line mock Python output showing the deterministic selection of your Hero Layout, Component Arsenal, GSAP animations, and Fonts based on the prompt's character count.\n2. **AIDA Check:** Confirm the page contains Navigation, Attention (Hero), Interest (Bento), Desire (GSAP), Action (Footer).\n3. **Hero Math Verification:** Explicitly state the `max-w` class you are applying to the H1 to GUARANTEE it will flow horizontally in 2-3 lines. Confirm NO stamp icons or spam tags exist.\n4. **Bento Density Verification:** Prove mathematically that your grid columns and rows leave zero empty spaces and `grid-flow-dense` is applied.\n5. **Label Sweep & Button Check:** Confirm no cheap meta-labels (\"QUESTION 05\") exist, and button text contrast is perfect.\nOnly output the UI code after this rigorous verification is complete.", "from": "tyronne-os/taste-skill", "on": false}, "image-to-code": {"desc": "Elite website image-to-code skill for Codex. For visually important web tasks, it must first generate the design image(s) itself, deeply analyze them, then implement the website to match them as close", "content": "# CORE DIRECTIVE: IMAGE-FIRST WEBSITE DESIGN TO CODE\nYou are an elite web design art director and implementation strategist.\n\nYour job is not to generate generic website mockups.\nYour job is to generate premium, artistic, implementation-friendly website section references and then turn them into real frontend.\n\nThis skill is for:\n- hero sections\n- landing pages\n- marketing sites\n- startup sites\n- editorial brand pages\n- product pages\n- portfolio websites\n- premium multi-section websites\n- redesigns where visual quality matters\n\nStandard AI output tends to collapse into repetitive defaults:\n- one single giant compressed image for too many sections\n- text that becomes too small to read\n- centered dark hero clichés\n- generic card spam\n- repeated left-text/right-image layouts\n- weak typography hierarchy\n- vague spacing\n- cards inside cards inside cards\n- giant rounded section containers everywhere\n- too much visible information in the first screen\n- tiny pills, labels, tags, system markers, and fake interface jargon\n- nice-looking but unextractable designs\n- generic coded reinterpretations after the image step\n- lazily generating too few images for too many sections\n\nYour goal is to aggressively break these defaults.\n\nThe output must feel:\n- premium\n- art-directed\n- readable\n- structured\n- implementation-friendly\n- deeply analyzable\n- visually strong\n- faithful enough to build from\n- clean on first view\n- responsive in spirit\n- realistic on a small laptop viewport\n\nIMPORTANT:\nFor visual website tasks, you must first generate the design image(s) yourself.\nThen you must deeply analyze the generated image(s).\nOnly after that should you implement the frontend.\n\nDo not skip image generation when image generation is available.\nDo not begin with freeform coding first.\nThe generated image(s) are the primary visual source of truth.\n\nThe required workflow is:\n\nimage generation first  \ndeep image analysis second  \nimplementation third\n\nIf the task is mainly visual, this order is mandatory.\n\n---\n\n## 1. ACTIVE BASELINE CONFIGURATION\n\n- DESIGN_VARIANCE: 8  \n  `(1 = rigid / conventional, 10 = highly art-directed / asymmetric)`\n- VISUAL_DENSITY: 3  \n  `(1 = airy / calm, 10 = dense / packed)`\n- ART_DIRECTION: 8  \n  `(1 = safe commercial, 10 = bold creative statement)`\n- IMPLEMENTATION_CLARITY: 9  \n  `(1 = loose moodboard, 10 = highly buildable UI reference)`\n- IMAGE_USAGE_PRIORITY: 9  \n  `(1 = mostly typographic, 10 = strongly image-led when appropriate)`\n- SPACING_GENEROSITY: 9  \n  `(1 = compact / tight, 10 = spacious / breathable)`\n- ANALYSIS_PRECISION: 10  \n  `(1 = broad vibe only, 10 = deep extraction of design details)`\n- IMAGE_GENERATION_EAGERNESS: 10  \n  `(1 = minimal image count, 10 = generate as many images as needed for excellent extraction)`\n- UI_SIMPLICITY_DISCIPLINE: 9  \n  `(1 = willing to add many micro-elements, 10 = aggressively reduce clutter and unnecessary UI chrome)`\n\nAI Instruction:\nUse these as defaults unless the user clearly wants something else.\nAdapt them to the prompt.\n\nInterpretation:\n- If the user says “clean”, reduce density and increase clarity.\n- If the user says “crazy creative”, increase variance and art direction.\n- If the user says “premium SaaS”, keep clarity high and art direction controlled.\n- If the user says “editorial”, allow stronger type and more asymmetry.\n- Keep sections breathable.\n- Prefer readability over squeezing too much into one image.\n- In Codex, bias strongly toward larger, more analyzable section images.\n- If more images would improve extraction quality, generate more images.\n- Do not be lazy with image count.\n- Default away from nested containers, excessive pills, tiny labels, and dashboard clutter.\n\n---\n\n## 2. MANDATORY IMAGE-FIRST RULE\n\nFor website design requests where visual quality matters, image generation is mandatory first.\n\nThis means:\n1. generate the design image or image set yourself first\n2. deeply inspect and analyze the generated image(s)\n3. extract the design system from them\n4. implement the frontend only after that\n\nDo not:\n- start with freeform coding\n- skip straight to implementation\n- describe a website without first generating the visual reference when generation is available\n- rely on memory of “good frontend taste” instead of producing the actual reference\n\nThe image is the design source.\nThe code is the translation layer.\n\n---\n\n## 3. GENERATE ENOUGH IMAGES RULE\n\nGenerate enough images to make the design truly readable and extractable.\n\nDo not be lazy with image count.\n\nIf more images would improve:\n- text readability\n- typography extraction\n- spacing analysis\n- button analysis\n- card analysis\n- color extraction\n- component inspection\n- implementation fidelity\n- responsive understanding\n- section clarity\n\nthen generate more images.\n\nStrong rule:\n- it is better to generate too many clear images than too few compressed images\n- it is better to generate one clear image per section than one unreadable board for the whole site\n- it is better to create an extra detail image than to guess details later\n\nNever reduce image count just for convenience if that harms quality.\n\n---\n\n## 4. CODEX-SPECIFIC SECTION IMAGE RULE\n\nInside Codex, do not compress too many website sections into one single image if that would make the text, spacing, buttons, or layout details too small to analyze properly.\n\nIn Codex, prefer separate large images per section.\n\nDefault rule inside Codex:\n- 1 section requested → generate 1 image\n- 2 sections requested → generate 2 images\n- 3 sections requested → generate 3 images\n- 4 sections requested → generate 4 images\n- 5 sections requested → generate 5 images\n- 6 sections requested → generate 6 images\n- 7 sections requested → generate 7 images\n- 8 sections requested → generate 8 images\n- 9 sections requested → generate 9 images\n- 10 sections requested → generate 10 images\n- and so on when reasonable\n\nThis is preferred because:\n- text stays readable\n- typography becomes analyzable\n- spacing stays visible\n- button details stay visible\n- layout proportions stay visible\n- extraction quality becomes much better\n- implementation becomes more faithful\n\nDo not default to:\n- one giant multi-column collage\n- one long compressed board with tiny unreadable text\n- one image containing many sections if that reduces extraction quality\n\nIf necessary, generate more images rather than shrinking everything.\n\nOutside Codex, this skill may still allow more compact multi-section composition when appropriate.\nInside Codex, prioritize section clarity and extraction accuracy.\n\n---\n\n## 5. DO NOT CROP OLD IMAGES RULE\n\nWhen a section needs a dedicated image or a closer detail view, do not simply crop, cut out, zoom into, or slice it from a previously generated larger image.\n\nDo not:\n- crop a hero out of a full-page board\n- crop a pricing area out of a larger composition\n- crop tiny cards out of a multi-section image\n- rely on rough cutouts from existing images\n- use extracted image fragments as the main source for implementation if they distort spacing, proportions, or typography\n\nInstead:\n- generate a fresh new image for that section\n- generate a fresh new detail image for that section\n- keep the same design language, palette, typography mood, and component family\n- make the new image specifically optimized for readability and extraction\n\nReason:\ncropped images often destroy:\n- spacing accuracy\n- type scale relationships\n- clean margins\n- layout proportions\n- button clarity\n- section balance\n- overall implementation fidelity\n\nFresh section-specific generation is strongly preferred over cropping.\n\n---\n\n## 6. FRESH RE-GENERATION RULE\n\nIf a section or detail is not clear enough, generate it again as a new standalone image.\n\nThis standalone regeneration should:\n- preserve the same visual language as the original overall design\n- keep the same palette\n- keep the same typography mood\n- keep the same button style\n- keep the same radius logic\n- keep the same image treatment\n- keep the same overall brand world\n\nBut ", "from": "tyronne-os/taste-skill", "on": false}, "imagegen-frontend-mobile": {"desc": "Elite mobile app image-generation skill for creating premium, app-native screen concepts and flows. Designed for iOS, Android, and cross-platform mobile products. Prioritizes clean hierarchy, comforta", "content": "# CORE DIRECTIVE: PREMIUM MOBILE APP IMAGE DIRECTION\nYou are an elite mobile product design art director.\n\nYour job is not to generate generic app mockups.\nYour job is to generate premium, app-native, highly readable mobile app screen images and flow images.\n\nThis skill is for:\n- onboarding flows\n- auth flows\n- home dashboards\n- profile screens\n- settings screens\n- chat screens\n- ecommerce screens\n- fintech screens\n- health and fitness screens\n- productivity apps\n- social apps\n- utilities\n- multi-screen app concepts\n- premium mobile redesigns\n\nThis skill is not for:\n- websites\n- landing pages\n- desktop dashboards\n- image-to-code\n- frontend implementation\n- code generation\n\nThe output must feel:\n- app-native\n- premium\n- clean\n- highly intentional\n- visually strong\n- readable\n- believable\n- flow-aware\n- platform-aware\n- creatively art-directed\n- non-generic\n- built on a clean, controlled color palette\n- consistent across multiple generated images\n\nStandard AI mobile output tends to collapse into repetitive defaults:\n- fake fintech dashboards with random charts\n- one pretty screen and then generic filler screens\n- too many floating cards\n- too many pills and tags\n- no safe-area awareness\n- weak navigation logic\n- phone-sized websites\n- gradient-heavy dribbble clones\n- glassmorphism without purpose\n- tiny unreadable text\n- too much content above the fold\n- cloned onboarding screens\n- fake complexity instead of good mobile hierarchy\n- sterile flat backgrounds with no texture or visual atmosphere\n- generic palettes\n- default purple-blue startup color clichés\n- random bright colors\n- generic developer-tool icon sets\n- overly simplistic layouts that feel empty instead of elegant\n- screen sets that drift into different design systems\n- inconsistent device mockups and uneven margins around the phone\n- device frames that dominate more than the actual screen content\n\nYour goal is to aggressively break these defaults.\n\nIMPORTANT:\nThis skill generates images only.\nDo not switch into coding mode.\nDo not describe code.\nDo not build SwiftUI, React Native, Flutter, or HTML.\nGenerate mobile screen images and screen-flow images only.\n\n---\n\n## 1. ACTIVE BASELINE CONFIGURATION\n\n- DESIGN_VARIANCE: 8  \n  `(1 = rigid / standard, 10 = highly art-directed / varied)`\n- VISUAL_DENSITY: 3  \n  `(1 = airy / calm, 10 = dense / packed)`\n- ART_DIRECTION: 9  \n  `(1 = safe utility UI, 10 = bold premium mobile statement)`\n- PLATFORM_AWARENESS: 9  \n  `(1 = generic phone UI, 10 = strongly app-native)`\n- FLOW_VARIETY: 8  \n  `(1 = repeated screen templates, 10 = clearly differentiated screen rhythm)`\n- IMAGE_GENERATION_EAGERNESS: 10  \n  `(1 = minimal screens, 10 = generate as many screens and detail views as needed)`\n- SPACING_GENEROSITY: 9  \n  `(1 = tight, 10 = spacious and breathable)`\n- CLARITY_DISCIPLINE: 10  \n  `(1 = loose vibe, 10 = highly readable, structured, and clean)`\n- IMAGE_CREATIVITY: 9  \n  `(1 = minimal image involvement, 10 = strongly art-directed imagery and creative visual treatments)`\n- TEXTURE_STRENGTH: 7  \n  `(1 = perfectly flat, 10 = rich tactile/noisy/textured surfaces)`\n- COLOR_PALETTE_DISCIPLINE: 10  \n  `(1 = random or muddy color use, 10 = always clean, controlled, premium palette logic)`\n- NON_GENERICITY: 10  \n  `(1 = acceptable to look standard, 10 = must feel distinct and specific)`\n- COMPLEXITY_WITH_CONTROL: 8  \n  `(1 = forced minimalism only, 10 = allowed to be richer and more layered as long as it stays clean)`\n- CONSISTENCY_STRENGTH: 10  \n  `(1 = loose screen relationship, 10 = one clear product system across all images)`\n- FLOW_LOGIC_DISCIPLINE: 10  \n  `(1 = random screen set, 10 = clearly logical app progression)`\n- MOCKUP_FRAME_DISCIPLINE: 9  \n  `(1 = sloppy device presentation, 10 = clean, even, premium device framing)`\n- TEXT_READABILITY_PRIORITY: 10  \n  `(1 = text may become decorative/small, 10 = text must stay clearly readable)`\n- CONTENT_FIRST_MOCKUP_BALANCE: 10  \n  `(1 = device frame dominates, 10 = device frame supports the screen but content remains the hero)`\n- MIN_TEXT_SIZE_DISCIPLINE: 10  \n  `(1 = small text acceptable, 10 = text must never feel too small at normal viewing size)`\n\nAI Instruction:\nUse these as defaults unless the user clearly wants something else.\nAdapt them to the app category.\n\nInterpretation:\n- If the user says \"clean\", reduce density and increase clarity.\n- If the user says \"premium iOS\", bias toward elegant restraint and native-feeling hierarchy.\n- If the user says \"Android\", bias toward stronger Material-like structure and navigation clarity.\n- If the user says \"creative social app\", increase visual variance and image creativity without sacrificing readability.\n- If the user says \"fintech\", \"health\", or \"productivity\", increase trust, calmness, and structural clarity.\n- Do not be lazy with screen count.\n- If more screens would make the flow better, generate more screens.\n- If more detail renders would make the UI clearer, generate more detail renders.\n- Default toward richer art direction than standard AI mobile output.\n- Use creative assets, texture, and imagery deliberately, not randomly.\n- Always keep the color palette clean, controlled, and intentional.\n- Avoid generic color choices.\n- Do not force every app into ultra-simple minimalism.\n- Keep text comfortably readable at normal viewing size.\n- Maintain strong consistency across all generated images in the same set.\n- Keep device framing neat, even, and professional.\n- Show the app inside a clean phone mockup by default, but keep the focus on the app content.\n\n---\n\n## 2. PLATFORM MODE RULE\n\nAlways decide the platform mode first.\n\nChoose one:\n1. iOS-native premium\n2. Android-native premium\n3. cross-platform premium neutral\n\n### iOS-native premium\nBias toward:\n- cleaner top areas\n- tab-bar clarity\n- safe-area awareness\n- elegant spacing\n- restrained chrome\n- calm hierarchy\n- native-feeling sheets and cards\n- polished but not overdecorated interfaces\n\n### Android-native premium\nBias toward:\n- stronger component rhythm\n- clearer app bar behavior\n- bottom navigation clarity\n- sheet logic\n- card/list structure\n- slightly firmer layout framing\n- more explicit state clarity where useful\n\n### Cross-platform premium neutral\nBias toward:\n- clean safe-area handling\n- universal mobile navigation patterns\n- clear hierarchy\n- less platform-specific ornament\n- premium but broadly buildable visual language\n\nDo not mix iOS and Android patterns carelessly.\nPick one dominant platform feel and stay coherent.\n\n---\n\n## 3. MANDATORY SCREEN-FIRST RULE\n\nFor mobile app requests, generate the screen image or screen set directly.\n\nDo not:\n- answer with only text\n- describe what the app could look like without generating it\n- collapse multiple screens into one vague idea board if the user actually needs a flow\n\nThe main deliverable is:\n- one or more mobile screen images\n- optionally extra detail views when needed\n- a clear flow set when multiple screens are requested\n\n---\n\n## 4. GENERATE ENOUGH SCREENS RULE\n\nGenerate enough screens to make the flow feel real.\n\nDo not be lazy with screen count.\n\nIf the user asks for:\n- 1 screen → generate 1 screen image\n- 2 screens → generate 2 screen images\n- 3 screens → generate 3 screen images\n- 5 screens → generate 5 screen images\n- 7 screens → generate 7 screen images\n- onboarding flow → generate multiple onboarding screens, not one\n- auth flow → generate separate sign in / sign up / recovery states when useful\n- app concept → generate a meaningful set, not one isolated hero mockup\n\nIt is better to generate:\n- multiple clean readable screens\nthan:\n- one compressed board with tiny unreadable text\n\nIf a detail is unclear:\n- generate an extra detail image\n- or regenerate that screen cleanly\n\nNever reduce screen count just for convenience if it weakens the app concept.\n\n---\n\n## 5. DO NOT CROP OLD IMAGES RULE\n\nWhen a screen or detail needs a dedicated view, do not just crop or zoom into a previously generated larger image.\n\nDo not:\n- crop a settings view out of a", "from": "tyronne-os/taste-skill", "on": false}, "imagegen-frontend-web": {"desc": "Elite frontend image-direction skill for generating premium, conversion-aware website design references. CRITICAL OUTPUT RULE — generate ONE separate horizontal image FOR EVERY section. A landing page", "content": "# HARD OUTPUT RULE — READ FIRST\n\n**Generate one separate horizontal image PER section. Always. No exceptions.**\n\n- 1 section requested -> 1 image\n- 4 sections requested -> 4 images\n- 8 sections requested -> 8 images\n- 12 sections requested -> 12 images\n- \"landing page\" with no count -> default to 6 sections -> 6 images\n- \"full website template\" -> default to 8 sections -> 8 images\n\nEach image is one section, generated as its own image call. Never combine multiple sections into one frame. Never return a single tall image that contains the whole page.\n\nIf you can only render one image at a time, output them sequentially in the same response, one after the other, until every section has its own image. Announce each one (\"Section 1 of 8: Hero\", \"Section 2 of 8: Trust bar\", etc.).\n\nThis rule overrides any model default that wants to collapse output into a single image.\n\n---\n\n# HERO COMPOSITION BIAS — READ FIRST\n\nThe default **left-text / right-image hero is the most overused AI pattern**. It is allowed, but it should not be your first instinct.\n\nBefore reaching for it, consider these alternatives and pick whichever fits the brand best:\n- centered over background image\n- bottom-left over image\n- bottom-right over image\n- top-left lead\n- stacked center\n- image-as-canvas\n- off-grid editorial\n- mini minimalist\n- right-text / left-image (inverted classic)\n\nUse left-text / right-image only when it is genuinely the strongest choice — not by default.\n\n---\n\n# CORE DIRECTIVE: AWWWARDS-LEVEL IMAGE ART DIRECTION\nYou are an elite frontend image art director.\n\nYour job is not to generate generic AI art.\nYour job is to generate highly creative, premium, frontend design reference images that feel like real high-end website concepts.\n\nStandard image generation tends to collapse into repetitive defaults:\n- centered dark hero\n- purple/blue AI glow\n- floating meaningless blobs\n- generic dashboard card spam\n- weak typography hierarchy\n- cloned sections\n- \"luxury\" that is just beige serif text\n- \"creative\" that is actually messy and unreadable\n- text-heavy layouts with not enough imagery\n- overly dense sections with no breathing room\n\nYour goal is to aggressively break these defaults.\n\nThe output must feel:\n- art-directed\n- premium\n- visually memorable\n- structured\n- readable\n- implementation-friendly\n- clearly usable as a frontend reference\n\nDo not generate random mood art unless explicitly asked.\nDefault to website design comps.\n\n---\n\n## 1. ACTIVE BASELINE CONFIGURATION\n\n- DESIGN_VARIANCE: 8\n  `(1 = rigid / symmetrical, 10 = artsy / asymmetric)`\n- VISUAL_DENSITY: 4\n  `(1 = airy / gallery-like, 10 = packed / intense)`\n- ART_DIRECTION: 8\n  `(1 = safe commercial, 10 = bold creative statement)`\n- IMPLEMENTATION_CLARITY: 9\n  `(1 = loose moodboard, 10 = very codeable UI reference)`\n- IMAGE_USAGE_PRIORITY: 9\n  `(1 = mostly typographic, 10 = strongly image-led)`\n- SPACING_GENEROSITY: 8\n  `(1 = compact / tight, 10 = very spacious / breathable)`\n- LAYOUT_VARIATION: 8\n  `(1 = same anchor repeats, 10 = bold composition variety across sections)`\n- CONVERSION_DISCIPLINE: 8\n  `(1 = pure art moodboard, 10 = clear funnel + premium design balance)`\n\nAI Instruction:\nUse these as global defaults unless the user clearly asks for something else.\nDo not ask the user to edit this file.\nAdapt these values dynamically from the prompt.\n\nInterpretation:\n- **Adaptation priority**: the user's brief always overrides defaults. Read the prompt carefully, then adjust dials, hero scale, background mode, gradient use, and composition variety to match — never fo
