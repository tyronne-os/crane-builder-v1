<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Crane Builder — Amanda Chat</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#09090b;--card:#111113;--muted:#71717a;--gold:#eeca50}
*{box-sizing:border-box;margin:0;padding:0}
body{height:100vh;background:var(--bg);color:#fafafa;font-family:'Geist',system-ui,sans-serif;display:flex;flex-direction:column}
header{padding:12px 16px;border-bottom:1px solid #1f1f24;display:flex;justify-content:space-between;align-items:center}
h1{font-size:16px;letter-spacing:.08em}
#status{font-family:'Geist Mono',monospace;font-size:11px;color:var(--muted)}
#chat{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:8px}
.msg.me{justify-content:flex-end}
.bubble{max-width:70%;padding:10px 12px;border-radius:12px;font-size:14px;line-height:1.5}
.msg.amanda .bubble{background:var(--card);border:1px solid #1f1f24}
.msg.me .bubble{background:#1c1c1f}
#composer{display:flex;gap:8px;padding:12px;border-top:1px solid #1f1f24;background:var(--bg)}
#input{flex:1;padding:10px 12px;border-radius:10px;background:#111113;border:1px solid #1f1f24;color:#fafafa;font-size:14px}
button{background:var(--gold);color:#1a1204;border:none;padding:10px 16px;border-radius:10px;font-weight:700;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const HF_TOKEN = localStorage.getItem('hfApiKey') || "";
const HF_MODEL = localStorage.getItem('hfModel') || "meta-llama/Llama-3.1-8B-Instruct";
const HF_BASE = "https://api-inference.huggingface.co/models";

function useHFChat(){
  const [msgs,setMsgs]=React.useState([{who:'amanda',text:'Hi! I’m Amanda. Set hfApiKey in localStorage to enable HF GPU chat.'}]);
  const [busy,setBusy]=React.useState(false);
  const [start,setStart]=React.useState(null);
  React.useEffect(()=>{ if(!start) setStart(Date.now()); },[]);
  const elapsed = start? Math.floor((Date.now()-start)/60000):0;
  async function send(text){
    if(!text.trim()||busy) return;
    if(!HF_TOKEN){ setMsgs(m=>[...m,{who:'amanda',text:'Set localStorage.hfApiKey first.'}]); return; }
    const newMsgs=[...msgs,{who:'me',text},{who:'amanda',text:''}];
    setMsgs(newMsgs); setBusy(true);
    try{
      const res=await fetch(`${HF_BASE}/${HF_MODEL}`,{
        method:'POST',
        headers:{Authorization:`Bearer ${HF_TOKEN}`,'Content-Type':'application/json'},
        body:JSON.stringify({inputs:text})
      });
      if(!res.ok) throw new Error(`HF ${res.status}`);
      const data=await res.json();
      const reply=(data[0]?.generated_text||data.generated_text||'').toString();
      setMsgs(m=>[...m.slice(0,-1),{who:'amanda',text:reply}]);
    }catch(e){
      setMsgs(m=>[...m.slice(0,-1),{who:'amanda',text:`⚠️ ${e.message}`}]);
    }finally{setBusy(false);}
  }
  return {msgs,send,busy,elapsed};
}

function App(){
  const {msgs,send,busy,elapsed}=useHFChat();
  const [input,setInput]=React.useState('');
  return (
    <div style={{display:'flex',flexDirection:'column',height:'100vh'}}>
      <header><h1>AMANDA — HF GPU CHAT</h1><div id="status">HF GPU: {elapsed}m</div></header>
      <div id="chat">
        {msgs.map((m,i)=><div key={i} className={'msg '+m.who}><div className="bubble">{m.text}</div></div>)}
      </div>
      <div id="composer">
        <input id="input" value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send(input);setInput('');}}} placeholder="Message Amanda…" />
        <button onClick={()=>{send(input);setInput('');}} disabled={busy}>{busy?'…':'Send'}</button>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
